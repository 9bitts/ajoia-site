name: audit

on:
  push:
  pull_request:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bloqueia aviso crítico
        run: npm audit --audit-level=critical
      - name: Relato de avisos altos ainda sem correção segura
        run: npm audit --audit-level=high
        continue-on-error: true
